<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>@import "tailwindcss";

[data-reveal]{opacity:0;transform:translateY(52px);transition:opacity 1s var(--ease),transform 1s var(--ease)}[data-reveal].is-visible{opacity:1;transform:none}.text-link{display:inline-flex;align-items:center;gap:38px;margin-top:28px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.5);font-size:10px;text-transform:uppercase;letter-spacing:.18em}.text-link span{font-size:16px}.hero-scroll{position:absolute;z-index:5;bottom:32px;right:4.5vw;display:flex;align-items:center;gap:13px;text-transform:uppercase;letter-spacing:.2em;font-size:8px}.hero-scroll span{display:block;width:18px;height:37px;border:1px solid rgba(255,255,255,.45);border-radius:12px;position:relative}.hero-scroll span::after{content:"";position:absolute;left:7px;top:7px;width:2px;height:6px;background:#fff;animation:scrollDot 1.8s infinite}
